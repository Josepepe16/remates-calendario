<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#198754">
    <title>Ingresar — Remates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f5132 0%, #198754 50%, #20c997 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            padding: 36px 28px 28px;
            width: 100%;
            max-width: 380px;
        }
        .brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #198754, #20c997);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 8px 20px rgba(25,135,84,.35);
        }
        .brand-icon i { font-size: 1.8rem; color: #fff; }
        .brand-title { font-size: 1.4rem; font-weight: 800; color: #212529; }
        .brand-sub { font-size: .8rem; color: #6c757d; margin-top: 2px; }
        .form-label { font-size: .78rem; font-weight: 600; color: #495057; margin-bottom: 4px; }
        .form-control {
            border-radius: 12px; border-color: #dee2e6;
            padding: 12px 16px; font-size: .95rem;
        }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25,135,84,.15);
        }
        .input-group-text {
            border-radius: 12px 0 0 12px;
            background: #f8f9fa; border-color: #dee2e6; color: #6c757d;
        }
        .input-group .form-control { border-radius: 0 12px 12px 0; }
        .btn-login {
            border-radius: 12px; padding: 12px;
            font-size: 1rem; font-weight: 700;
            background: linear-gradient(135deg, #198754, #20c997);
            border: none; color: #fff; width: 100%;
            box-shadow: 0 4px 16px rgba(25,135,84,.35);
            transition: opacity .2s;
        }
        .btn-login:hover { opacity: .92; color: #fff; }
        .btn-login:active { opacity: .85; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon"><i class="bi bi-calendar-event-fill"></i></div>
            <div class="brand-title">Remates</div>
            <div class="brand-sub">Gestión de calendario</div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ 'success' if cat == 'success' else 'danger' }} py-2 mb-3" style="border-radius:12px; font-size:.85rem;">
            <i class="bi bi-{{ 'check-circle' if cat == 'success' else 'exclamation-circle' }}-fill me-1"></i>{{ msg }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Tu usuario"
                           autocomplete="username" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Tu contraseña"
                           autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
