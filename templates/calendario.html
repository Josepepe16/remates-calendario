{% extends "base.html" %}
{% block title %}Calendario{% endblock %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<style>
    #calendar-container { background:#fff; border-radius:16px; box-shadow:0 2px 10px rgba(0,0,0,.07); padding:12px; }
    .fc .fc-toolbar-title { font-size:1rem; font-weight:700; }
    .fc .fc-button { font-size:.8rem; padding:4px 10px; }
    .fc .fc-button-primary { background:var(--green,#198754); border-color:var(--green,#198754); }
    .fc .fc-button-primary:hover { background:#146c43; border-color:#146c43; }
    .fc .fc-daygrid-event { border-radius:6px; font-size:.7rem; }
    .fc .fc-list-event-title a { color:inherit; }
    .fc .fc-list-day-cushion { background:#f4f6f8; }
    .legend-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
</style>
{% endblock %}

{% block content %}
<div class="page-title mt-3 mb-3">Calendario</div>

<!-- Legend -->
<div class="d-flex flex-wrap gap-3 mb-3" style="font-size:.75rem;">
    <span><span class="legend-dot me-1" style="background:#0d6efd;"></span>Programado</span>
    <span><span class="legend-dot me-1" style="background:#fd7e14;"></span>En progreso</span>
    <span><span class="legend-dot me-1" style="background:#198754;"></span>Finalizado</span>
    <span><span class="legend-dot me-1" style="background:#6f42c1;"></span>Fotos</span>
    <span><span class="legend-dot me-1" style="background:#e83e8c;"></span>Videos</span>
</div>

<div id="calendar-container">
    <div id="calendar"></div>
</div>

<div style="height:8px;"></div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const isMobile = window.innerWidth < 768;
    const cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: isMobile ? 'listMonth' : 'dayGridMonth',
        locale: 'es',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'listMonth,dayGridMonth'
        },
        buttonText: { dayGridMonth: 'Mes', listMonth: 'Lista', today: 'Hoy' },
        titleFormat: isMobile ? { month: 'short', year: 'numeric' } : { month: 'long', year: 'numeric' },
        events: '/api/eventos',
        eventClick: function(info) {
            info.jsEvent.preventDefault();
            if (info.event.url) window.location.href = info.event.url;
        },
        eventDidMount: function(info) {
            if (info.event.extendedProps.estado) {
                info.el.title =
                    info.event.title + '\n' +
                    (info.event.extendedProps.lugar || '') + ' ' +
                    (info.event.extendedProps.ciudad || '') + '\n' +
                    info.event.extendedProps.estado;
            }
        },
        height: 'auto',
        firstDay: 1,
    });
    cal.render();

    window.addEventListener('resize', function() {
        const mobile = window.innerWidth < 768;
        cal.changeView(mobile ? 'listMonth' : 'dayGridMonth');
    });
});
</script>
{% endblock %}
